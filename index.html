<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 猜猜看 Pictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main-screen.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1><span class="icon">🎨</span> AI 猜猜看</h1>
        <p class="subtitle">Pictionary · Gemini Edition</p>
      </div>

      <div id="connectionStatus" class="status-badge offline">
        <span class="dot"></span><span class="label"> 初始化中</span>
      </div>

      <div class="qr-section">
        <div class="qr-frame">
          <div id="qrCodeContainer"></div>
        </div>
        <div class="room-info">
          <label>房間代號</label>
          <code id="roomDisplay">---</code>
        </div>
        <p class="hint">手機掃 QR Code 加入繪畫</p>
      </div>

      <div class="players-section">
        <h3>已連線玩家</h3>
        <ul id="playerList" class="player-list">
          <li class="empty">等待玩家加入…</li>
        </ul>
      </div>

      <div class="api-section">
        <h3>Gemini API 設定</h3>
        <div class="input-group">
          <input id="apiKeyInput" type="password" placeholder="輸入你的 Gemini API Key">
          <button id="saveKeyBtn" class="btn-small">儲存</button>
        </div>
        <p id="apiStatus" class="api-status"></p>
        <a class="help-link" href="https://aistudio.google.com/apikey" target="_blank">取得免費 API Key →</a>
      </div>
    </aside>

    <main class="gallery">
      <div class="gallery-header">
        <h2>玩家畫作廊</h2>
        <span id="drawingCount" class="count">0 幅</span>
      </div>
      <div id="galleryGrid" class="gallery-grid">
        <div class="empty-state">
          <div class="empty-icon">🖌️</div>
          <p>等待玩家送出畫作…</p>
          <p class="sub">掃描左側 QR Code 加入遊戲</p>
        </div>
      </div>
    </main>
  </div>

  <script src="vendor/ably.min.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="js/main-screen.js"></script>
</body>
</html>
